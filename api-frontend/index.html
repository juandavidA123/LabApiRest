<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas API REST</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f7f6;
            color: #333;
        }
    </style>
</head>

<body>
    <h1>Mi Gestor de Tareas (Consumiendo API REST)</h1>
    <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea...">
    <button onclick="agregarTarea()">Agregar Tarea</button>
    <button onclick="VaciarLista()">Vaciar Lista de Tareas</button>
    <ul id="listaTareas"></ul>

    <script>
        const API_URL = 'http://localhost:5000/api/tareas';

        // [GET] Obtener y mostrar las tareas
        async function cargarTareas() {
            const respuesta = await fetch(API_URL);
            const tareas = await respuesta.json();
            const lista = document.getElementById('listaTareas');

            lista.innerHTML = '';
            tareas.forEach(t => {
                lista.innerHTML += `<li>${t.texto} <button onclick="eliminarTarea(${t.id})">❌</button></li>`;
            });
        }

        // [POST] Crear una nueva tarea
        async function agregarTarea() {
            const input = document.getElementById('inputTarea');
            if (!input.value) return;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: input.value })
            });

            input.value = '';
            cargarTareas();
        }

        // [DELETE] Eliminar una tarea específica
        async function eliminarTarea(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            cargarTareas();
        }

        // [DELETE] Vaciar la lista completa
        async function VaciarLista() {
            try {
                const respuesta = await fetch(`${API_URL}/vaciar`, {
                    method: 'DELETE'
                });

                if (!respuesta.ok) {
                    throw new Error(`La API respondió con el estado ${respuesta.status}`);
                }

                await cargarTareas();
            } catch (error) {
                console.error('No se pudo vaciar la lista de tareas:', error);
                alert('No se pudo vaciar la lista. Revisa que la API esté funcionando.');
            }
        }

        // Carga inicial
        cargarTareas();
    </script>
</body>

</html>
